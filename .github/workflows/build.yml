name: Release

# 打标签触发：git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # 启用 GitHub OIDC 令牌颁发
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: |
          dotnet pack ZXUI.Svg.Core/ZXUI.Svg.Core.csproj -c Release -o artifacts
          dotnet pack ZXUI.Svg/ZXUI.Svg.csproj      -c Release -o artifacts

      # 先推 Core（Svg 依赖它）—— 每次 push 前都重新换临时 API Key（一次性）
      - name: NuGet login (Core)
        uses: NuGet/login@v1
        id: loginCore
        with:
          user: XueZhaorong

      - name: Publish Core
        run: >
          dotnet nuget push artifacts/ZXUI.Svg.Core.*.nupkg
          --api-key ${{ steps.loginCore.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

      - name: NuGet login (Svg)
        uses: NuGet/login@v1
        id: loginSvg
        with:
          user: XueZhaorong

      # [0-9] 通配只命中 ZXUI.Svg.1.0.1，不会误匹配 ZXUI.Svg.Core
      - name: Publish Svg
        run: >
          dotnet nuget push artifacts/ZXUI.Svg.[0-9]*.nupkg
          --api-key ${{ steps.loginSvg.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
