name: Publish ZXUI.Svg

# 触发：svg-v1.0.1 / git push origin svg-v1.0.1
on:
  push:
    tags:
      - 'svg-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack Svg
        run: dotnet pack ZXUI.Svg/ZXUI.Svg.csproj -c Release -o artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: XueZhaorong

      - name: Publish Svg
        run: >
          dotnet nuget push artifacts/ZXUI.Svg.[0-9]*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
